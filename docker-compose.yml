services:
  frontend:
    image: nginx:alpine
    container_name: portofolio-frontend
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4

  backend:
    build: .
    container_name: portofolio-backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - visitors-data:/app/data

volumes:
  visitors-data:
