server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve file statis (Frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin Dashboard — serve admin.html
    location = /admin {
        try_files /admin.html =404;
    }
    location = /admin.html {
        try_files /admin.html =404;
    }

    # Proxy requests API ke Backend Node.js
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings — cegah Nginx kirim HTML error jika backend lambat
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Pastikan error dari backend diteruskan ke client, bukan diganti Nginx
        proxy_intercept_errors off;
    }

    # Kembalikan JSON jika backend tidak bisa dijangkau (502/503/504)
    error_page 502 503 504 = @backend_unavailable;
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"success":false,"message":"Server sedang tidak tersedia. Silakan coba beberapa saat lagi."}';
    }

    # Keamanan: Blokir akses ke file backend dan konfigurasi
    location ~* (server\.js|send-email\.js|package\.json|package-lock\.json|Dockerfile|docker-compose\.yml|\.env.*|\.git.*|visitors\.db)$ {
        deny all;
    }
}
