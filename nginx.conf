server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve file statis (Frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests API ke Backend Node.js
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keamanan: Blokir akses ke file backend dan konfigurasi
    location ~* (server\.js|send-email\.js|package\.json|package-lock\.json|Dockerfile|docker-compose\.yml|\.env.*|\.git.*|.*\.md)$ {
        deny all;
    }
}
